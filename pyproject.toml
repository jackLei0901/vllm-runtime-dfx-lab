[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-runtime-dfx-lab"
version = "0.1.0"
description = "Reproducible runtime diagnostics and fault-injection lab for vLLM"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vllm-dfx = "dfxlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

